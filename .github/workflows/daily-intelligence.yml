name: Daily DSC news and sentiment archive

on:
  schedule:
    # One of these is 06:15 America/New_York before/after daylight saving time.
    - cron: '15 10,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Skip the non-06:15 UTC schedule during daylight-saving changes
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=America/New_York date +%H)" != '06' ]; then
            echo 'Not the scheduled America/New_York hour; exiting.'
            exit 0
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free public-source collectors
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check yt-dlp
          git clone https://github.com/mvanhorn/last30days-skill.git /tmp/last30days
          git -C /tmp/last30days checkout 1004324ad35a3ba656e6df0faabd54749e398455
      - name: Collect and archive public news
        run: |
          archive="news/archive/$(date -u +%Y/%m/%d).json"
          python scripts/refresh_news.py --output news/latest.json --archive-output "$archive"
      - name: Collect current public sentiment evidence
        run: |
          python scripts/collect_watchlist.py \
            --engine /tmp/last30days/skills/last30days/scripts/last30days.py \
            --watchlist config/watchlist.json \
            --output work/watchlist
      - name: Create evidence-grounded sentiment records
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          python scripts/summarize_watchlist.py \
            --manifest work/watchlist/manifest.json \
            --summarizer scripts/summarize.py \
            --output sentiment/watchlist
      - name: Preserve today's evidence and update the public pointer
        run: |
          evidence="evidence/watchlist/$(date -u +%F)"
          mkdir -p "$evidence"
          cp work/watchlist/*.json "$evidence/"
          python scripts/build_latest_index.py
      - name: Commit archive
        run: |
          git config user.name 'DSC archive bot'
          git config user.email 'dsc-archive-bot@users.noreply.github.com'
          git add news sentiment evidence latest.json
          git commit -m "archive: $(date -u +%F)" || exit 0
          git push
