name: Daily DSC news archive

on:
  schedule:
    # One of these is 06:15 America/New_York before/after daylight saving time.
    - cron: '15 10,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Skip the non-06:15 UTC schedule during daylight-saving changes
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=America/New_York date +%H)" != '06' ]; then
            echo 'Not the scheduled America/New_York hour; exiting.'
            exit 0
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and archive public news
        run: |
          archive="news/archive/$(date -u +%Y/%m/%d).json"
          python scripts/refresh_news.py --output news/latest.json --archive-output "$archive"
      - name: Commit archive
        run: |
          git config user.name 'DSC archive bot'
          git config user.email 'dsc-archive-bot@users.noreply.github.com'
          git add news
          git commit -m "news: $(date -u +%F)" || exit 0
          git push
